[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "demol"
version = "0.0.1"
description = "Domain-Specific Language for IoT Devices"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Konstantinos Panayiotou", email = "klpanagi@gmail.com" },
]
keywords = ["textX", "DSL", "IoT", "code-generation", "model-driven"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Topic :: Software Development :: Interpreters",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "textX[cli]>=4.3.0",
    "Jinja2>=3.1.3",
    "plantuml>=0.3.0",
    "click>=8.1.7",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2.1",
    "pygls>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "flake8",
    "mypy",
    "wheel",
    "twine",
]

[project.scripts]
demol = "demol.cli.cli:main"

[project.entry-points."textx_languages"]
demol-component = "demol:component_language"
demol-device = "demol:device_language"

[tool.setuptools.packages.find]
include = ["demol*"]

[tool.setuptools.package-data]
demol = ["*.tx"]

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------

[tool.black]
line-length = 120
target-version = ["py39"]

[tool.flake8]  # NOTE: flake8 does not natively read pyproject.toml;
               # use setup.cfg or Flake8-pyproject for now.

[tool.mypy]
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
